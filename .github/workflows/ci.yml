name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Sent by the CMS when a Post goes live, changes or is taken down (ADR 0001)
  repository_dispatch:
    types: [content-changed]

# Deploys run one at a time, so consecutive publishes don't race. Pull
# requests only cancel their own older runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, build, test & deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout files
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Node packages
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run CMS tests
        run: pnpm test:cms

      - name: Build against fixture content
        env:
          CONTENT_SOURCE: fixture
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/

      - name: Build against Payload
        if: github.event_name != 'pull_request'
        env:
          CONTENT_SOURCE: payload
        run: pnpm build

      - name: Deploy the site
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter web run deploy
